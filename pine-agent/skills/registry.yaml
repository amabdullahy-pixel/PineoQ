# ============================================================================
# SKILL REGISTRY — Pine Agent
# ============================================================================
# Maintained by Import Mode only — never hand-edited into existence.
# First populated by import batch-001 (2026-09): 10 Skills normalized.
#
# Entry schema:
#   id: <kebab-case unique id>
#   name: <human-readable name>
#   version: <semver>
#   path: <skills/normalized/<...>/skill.md>
#   source_path: <skills/incoming/<original>.md>
#   layer: <CORE | QUANT | RESEARCH | FORMALIZATION | FEASIBILITY |
#           IMPLEMENTATION | VERIFICATION | META>
#   domains: [<domain-id>, ...]
#   triggers:
#     english: [...]
#     persian: [...]
#   dependencies:
#     mandatory: [<skill-id>, ...]
#     optional: [<skill-id>, ...]
#   status: <normalized | review-needed | rejected>
#   activation: <eligible | inactive | blocked>
#   validation_status: <passed | partial | failed>
#   import_batch: <batch-id>
#   priority: <1-10>   # 1 = highest
#
# Routing rules (config/routing.yaml):
#   - only status:normalized + activation:eligible entries under
#     skills/normalized/ are discoverable
#   - review-needed/ rejected/ entries are never eligible
#   - dependency ids must exist in this registry
#
# PENDING OPTIONAL DEPENDENCIES (batch-001 convention):
#   Some entries list optional dependency ids for skills not yet imported.
#   As of batch-008 the 77-skill library is COMPLETE: every dependency id
#   referenced below resolves to a registered entry. The convention remains
#   in force for future library growth (new ids = new incoming files). These ids are the deterministic ids of pending incoming files,
#   explicitly documented in each skill's Import Report and parked in
#   skills/import-reports/processing-index.yaml (duplicate_candidates,
#   resolved: false). They are NOT invented. Router behavior: a missing
#   optional dependency is a no-op. Import Mode resolves these references
#   when the target skill is imported in a later batch.
# ============================================================================

