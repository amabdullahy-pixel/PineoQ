# Data-kind vocabulary for required_data entries (F04).
data_kinds:
  obtainable:
    - { kind: 'price',    status: 'confirmed', basis: 'OHLCV price data is core TradingView data' }
    - { kind: 'htf price', status: 'confirmed', basis: 'HTF data via request.security (mtf-engineering skill)' }
    - { kind: 'ltf price', status: 'confirmed', basis: 'LTF data via request.security_lower_tf (mtf-engineering skill)' }
    - { kind: 'volume',   status: 'confirmed', basis: 'volume is core OHLCV data; symbol-specific coverage verified downstream' }
    - { kind: 'economic', status: 'confirmed', basis: 'request.economic() VERIFIED (batch-006 verification event)' }
  conditional:
    - { kind: 'bid',   rule: '1T-only', basis: 'bid/ask 1T-only semantics VERIFIED (batch-006)' }
    - { kind: 'ask',   rule: '1T-only', basis: 'bid/ask 1T-only semantics VERIFIED (batch-006)' }
    - { kind: 'spread', rule: '1T-only', basis: 'bid/ask 1T-only semantics VERIFIED (batch-006)' }
  requires_verification:
    - { kind: 'open interest', basis: 'OI exists only on supported markets (config feasibility.data_availability note) — symbol-dependent' }
    - { kind: 'funding rate',  basis: 'funding rate exists only on supported markets (config feasibility.data_availability note) — symbol-dependent' }
  unavailable:
    - { kind: 'order book',   basis: 'no order-book access — preserved negative claim (batch-006)' }
    - { kind: 'sentiment',    basis: 'no native sentiment index — preserved negative claim (batch-006)' }
    - { kind: 'news',         basis: 'no news data access — preserved negative claim (batch-006)' }
    - { kind: 'quandl',       basis: 'request.quandl() REMOVED (batch-002)' }

# Advisory performance hints (F09). These are CONSERVATIVE ADVISORY thresholds,
# not platform limits: exact request.*/object budgets are tier-dependent and
# stay UNKNOWN_REQUIRES_VERIFICATION (never invented as hard limits).
performance_hints:
  request_calls_warn: '4'            # required_data entries beyond this warn (tier budget unknown)
  drawing_tokens: 'label|line|box|table|plot'
  loop_keywords: 'for every bar|loop over all|iterate over all|every bar in history|all historical bars'
  realtime_tokens: 'every tick|intrabar|realtime|tick by tick'
  onclose_tokens: 'on bar close|on close|bar close|confirmed'
