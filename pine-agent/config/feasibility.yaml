# ============================================================================
# FEASIBILITY CONFIGURATION — Pine Agent
# ============================================================================
# Governs the Feasibility stage, which runs AFTER Formalization and
# Pre-Verification and BEFORE Implementation. Output: feasibility contract
# (see feasibility/contract_schema.yaml).
# ============================================================================

feasibility:
  status: enabled

  # Each check: severity block => any fail becomes a blocker (stops pipeline);
  # severity warn  => recorded in `warnings`, surfaced to user, does not block.
  checks:

    - id: mathematical_validity
      field: mathematically_valid
      description: >
        All formulas are mathematically well-defined: no division by zero,
        no undefined logarithms/roots of negatives, no contradictory
        conditions, units and scales are consistent across terms.
      severity: block

    - id: statistical_meaningfulness
      field: statistically_meaningful
      description: >
        Thresholds, lookbacks, and windows have a defensible basis (adaptive,
        configurable, or justified constant). Magic numbers without rationale
        are warnings, not blockers.
      severity: warn

    - id: data_availability
      field: required_data_available
      description: >
        Every required data source exists on TradingView: symbol types
        (e.g., OI/funding exist only on supported markets), request.security
        targets resolvable, volumes available on the target class of symbols.
      severity: block

    - id: pine_compatibility
      field: pine_compatible
      description: >
        The design is expressible in Pine Script v6: required built-ins exist,
        no unsupported language features assumed, v6 semantics respected
        (lazy and/or, series history model, type system).
      severity: block

    - id: tradingview_execution_model
      field: tradingview_compatible
      description: >
        Design respects the TradingView execution model: bar-by-bar execution,
        rollback of realtime variables, request.* call budget (<= ~5-40 by
        plan tier), plot/label/line/box budgets, no future-data assumptions.
      severity: block

    - id: mtf_validity
      field: mtf_valid
      description: >
        Multi-timeframe constructs are valid: HTF data obtained via
        request.security with disciplined offset/lookahead policy; LTF
        requests only where supported; TF-unit consistency (minutes vs bars).
        Not applicable when mtf=false in the formalization contract.
      severity: block

    - id: repainting_risk
      field: repaint_risk
      description: >
        Repaint risk classified (none/low/medium/high) with mechanism named
        (security lookahead, unconfirmed HTF bars, intrabar pivot confirmation,
        realtime-only branches). High risk without explicit user acceptance
        is a blocker.
      severity: block

    - id: runtime_limits
      field: runtime_risk
      description: >
        Loop bounds are finite and small; array sizes bounded; no unbounded
        recursion; execution time compatible with TradingView limits
        (loop iterations and total time budgets).
      severity: block

    - id: numerical_stability
      field: numerical_stability
      description: >
        Accumulators guarded against na-poisoning; variance-type computations
        clamped against catastrophic cancellation; float comparisons use
        tolerances; extreme values (gaps, zero-range bars) handled.
      severity: block

  # --- Verdict rules ----------------------------------------------------------
  verdict:
    proceed_when: "all block-severity checks pass AND blockers list is empty"
    warn_user_when: "warnings list is non-empty (warnings do not block)"
    fail_when: "any block-severity check fails OR any blocker recorded"
    on_fail: "record blockers with reasons; pipeline stops before Implementation Planning"
    output_contract: feasibility/contract_schema.yaml

# ============================================================================
# PHASE 7 ADDITIONS — capability knowledge base (engine: feasibility.pl)
# ============================================================================
# EVIDENCE POLICY (meta/feasibility_procedure.md §3): entries are seeded ONLY
