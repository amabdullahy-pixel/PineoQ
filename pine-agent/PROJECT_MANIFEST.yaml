# ============================================================================
# PROJECT MANIFEST — Pine Agent (architecture scaffold)
# ============================================================================
# Authoritative machine-readable snapshot of the project. Update on every
# meaningful change; narrative context lives in README.md and CHANGELOG.md.
# ============================================================================

project:
  name: pine-agent
  version: "0.1.0"
  status: implementation-stage # architecture-stage | import-stage | router-design-stage | router-implementation-stage | formalization-stage | pre-verification-stage | feasibility-stage | implementation-planning-stage | implementation-stage | release (PHASE 3 design + PHASE 4 Router engine + PHASE 5 Formalization engine + PHASE 6 Pre-Verification engine + PHASE 7 Feasibility engine + PHASE 8 Implementation Planning engine + PHASE 9 Implementation engine complete 2026-09)
  objective: >
    Build a modular Agent for Pine Script v6 that processes user requests
    through a gated pipeline: Skill Routing -> Formalization -> Pre-Verification
    -> Feasibility -> Implementation Planning -> Pine Implementation ->
    Post-Verification. This phase delivers ONLY the architectural scaffold:
    contracts, configuration, documentation, templates, and test specifications.

pine:
  version: "6"
  compatibility_policy: >
    All future generated code must target Pine Script v6 exactly. No legacy
    v5/v4 fallbacks may be emitted by the Implementation stage.

pipeline:
  order:
    - request
    - skill_routing
    - formalization
    - pre_verification
    - feasibility
    - implementation_planning
    - implementation
    - post_verification
  stage_gates:
    formalization: "blocks implementation; output is the formalization contract"
    pre_verification: "must pass with zero blockers before feasibility/implementation"
    feasibility: "must pass with zero blockers before implementation"
    implementation: "requires approved formalization_id + feasibility_id"
    post_verification: "final gate; separate contract from pre-verification"

constraints:
  - "No code generation before Formalization"
  - "No implementation if Pre-Verification has blockers"
  - "No implementation if Feasibility fails (any blocker)"
  - "Ambiguities are recorded, never silently resolved"
  - "Assumptions are recorded explicitly"
  - "Repainting control is mandatory on every request"
  - "MTF behavior must be validated on every multi-timeframe request"
  - "Pine Script v6 compatibility is non-negotiable"
  - "Only the minimum required Skills and their mandatory dependencies are loaded"
  - "Never load all Skills by default"
  - "Pre-Verification and Post-Verification are separate stages with separate contracts"
  - "Scaffold-phase constraint (historical): no Pine Script code, no Skills, empty registry — superseded by Import Mode completion (see skills/registry.yaml and skills/import-reports/final-import-report.md); the no-Pine-code rule itself remains in force"

skills:
  imported: 77                        # all raw sources processed (batch-001..008)
  normalized: 77                      # all status:normalized, activation:eligible, validation_status:passed
  registry_state: populated           # 77 entries; full dependency closure; zero unresolved duplicate candidates
  directories:
    incoming: 77 raw sources preserved (never modified)
    normalized: 77 skills in 7 layer directories
    archived: empty
    rejected: empty
    review-needed: empty

implementation_allowed: false          # global gate; mirrored per-contract

architectural_decisions:
  - id: AD-01
    decision: "Gated pipeline with hard stage ordering"
    rationale: "Formalization before code, Feasibility before Implementation, dual verification — prevents ad-hoc code generation and silent guessing."
  - id: AD-02
    decision: "Every stage communicates via a YAML contract schema"
    rationale: "Machine-checkable handoffs; status and blockers are inspectable between stages."
  - id: AD-03
    decision: "Minimum-required Skill loading via registry-trigger routing"
    rationale: "Context economy; the Router must never load all Skills."
  - id: AD-04
    decision: "Registry starts empty; no placeholder Skills"
    rationale: "Skills enter only through a future Import/Normalize phase; prevents junk catalog."
  - id: AD-05
    decision: "ambiguities and blockers are first-class contract fields"
    rationale: "Unresolvable input or failed stage is recorded, not guessed around."
  - id: AD-06
    decision: "Separate pre_contract_schema and post_contract_schema"
    rationale: "Pre-checks intent (logic/math/data) before code exists; post-checks artifact (syntax/runtime/repaint/perf) after."
  - id: AD-07
    decision: "Router contract upgraded to routing/2 (design only; no executable logic)"
    rationale: "routing_status gains a five-value semantics (ready | ambiguous | insufficient_coverage | blocked | conflict_detected) with a mandatory 5-section routing_trace; v0.1 controlled-failure behaviors (empty registry, no-match) are preserved unchanged."
  - id: AD-08
    decision: "Five-layer routing configuration (classification | matching | selection | dependency | context) with strict separation: Registry holds Skill knowledge, routing.yaml holds rules, the Router is the decision engine, Formalization owns contract conversion"
    rationale: "Prevents skill content from leaking into policy files and routing logic from leaking into Skills; deterministic, explainable selection requires the separation."
  - id: AD-09
    decision: "Formalization approval is expressed solely by implementation_allowed (schema v1.1): true iff status=completed AND blockers empty AND every behavior-affecting ambiguity is resolved_by_user; resolved_assumed never unlocks; supersedes records revisions without altering the content-derived identity chain"
    rationale: "Single unambiguous gate field for the next stage's ordering check (--gate-check); assumed resolutions can never silently authorize implementation; content-addressed ids make revisions auditable."
  - id: AD-10
    decision: "Feasibility is an evidence-bounded decision layer (schema v1.1): capability/data claims come ONLY from Import-Mode-preserved evidence (confirmed | unavailable | requires_verification); unavailable items are recorded in unsupported_items and NEVER substituted; unknown platform limits stay UNKNOWN_REQUIRES_VERIFICATION (load-bearing unknowns block, prose unknowns warn); implementation_planning_allowed=true iff FEASIBLE | FEASIBLE_WITH_WARNINGS"
    rationale: "Feasibility answers CAN/SHOULD questions without inventing facts; no-silent-fallback plus advisory-only limits keep the gate honest; --gate-check --feasibility gives Implementation Planning a machine-checkable ordering gate."

