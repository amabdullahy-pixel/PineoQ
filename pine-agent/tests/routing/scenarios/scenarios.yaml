# ============================================================================
# ROUTING SCENARIO FIXTURES — concrete registry-backed requests
# ============================================================================
# Validates the Phase-3 Router design (meta/skill_router.md, routing/2) end to
# end against the REAL 77-skill registry via the Phase-4 engine:
#   perl skills/agent/router.pl --scenarios tests/routing/scenarios
#
# Ground rules (spec-faithful):
#   - Requests embed REGISTERED trigger phrases verbatim (English or Persian)
#     because trigger fidelity is binding: fuzzy matching is disabled
#     (config/routing.yaml matching_rules.trigger_fidelity.fuzzy_matching: false).
#   - Expectations assert only spec-derivable properties: routing status,
#     request class, Registry-sourced domains, selected/excluded membership,
#     downstream gating, and mandatory trace sections.
#   - Negative scenarios (controlled failures) are first-class: blocked and
#     ambiguous outcomes validate the design's no-guessing guarantees.
#
# spec_refs trace each scenario back to TEST-ROUTING-00x specifications.
# ============================================================================

# ---------------------------------------------------------------------------
scenario_id: SCEN-ROUTING-001
category: routing/scenario
spec_refs: [TEST-ROUTING-003, TEST-ROUTING-007]
title: "Debug request — debugging class core selected with full trace"
request: "Debug my script: pine logs log.info show the signal fires twice"
expect:
  routing_status: ready
  request_class: debugging
  selected_include: [pine-version-intelligence, pine-debugging-and-testing]
  selected_exclude: [code-review-and-refactoring]
  downstream_allowed: true
  trace_sections_present: [classification, matching, minimal_set_reasoning, dependency_resolution, redundancy_analysis]
notes: "Skill 75 rule 2 debug map: core {06, 70}. Review skill (71) is related_but_distinct and must stay out of a debug set."

