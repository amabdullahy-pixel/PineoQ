scenario_id: SCEN-ROUTING-009
category: routing/scenario
spec_refs: [TEST-ROUTING-004, TEST-ROUTING-007]
title: "Persian debug request with no matching registered trigger — controlled failure (recorded coverage gap)"
request: "چرا سیگنال من دو بار فعال می شود"
expect:
  routing_status: blocked
  missing_capabilities_min_count: 1
  downstream_allowed: false
notes: "KNOWN COVERAGE GAP (recorded, not hidden): the registry registers no Persian trigger for double-signal/debug semantics; Persian triggers cover volume/TA terms (e.g. حجم نسبی). Trigger fidelity forbids broadening, so the Router fails in a controlled manner and itemizes unmatched terms. Remedy belongs to Import Mode (new/broadened Persian triggers), not to routing."

